<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="660" viewBox="0 0 1280 660" role="img" aria-labelledby="title desc"><title id="title">architecture</title><desc id="desc">Encoder and predictor follow the base training objective. A detached feature branch builds same-scene device paths and regularizes a shared deterministic predictor. Anchors commit after successful updates.</desc><rect x="0" y="0" width="1280" height="660" rx="20" fill="#f4f6fa" stroke="none"/><text x="40" y="49" fill="#52657e" font-size="14" font-weight="700" font-family="Inter,Segoe UI,Arial,sans-serif" letter-spacing="1.2">A TRAINING BRANCH. A SIMPLE DEPLOYMENT PATH.</text><text x="40" y="84" fill="#10213b" font-size="27" font-weight="600" font-family="Inter,Segoe UI,Arial,sans-serif" >Scene discrimination along structured device transitions</text><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#698399" stroke-width="1.3"/></marker></defs><rect x="40" y="120" width="205" height="130" rx="14" fill="#ffffff" stroke="#dce4ec"/><text x="59" y="149" fill="#0d8072" font-size="11" font-weight="700" font-family="Inter,Segoe UI,Arial,sans-serif" letter-spacing="1.0">INPUT</text><text x="59" y="180" fill="#142b46" font-size="20" font-weight="600" font-family="Inter,Segoe UI,Arial,sans-serif" >Audio features</text><text x="59" y="209" fill="#60758b" font-size="13" font-weight="400" font-family="Inter,Segoe UI,Arial,sans-serif" >Single-source segments</text><text x="59" y="231" fill="#60758b" font-size="13" font-weight="400" font-family="Inter,Segoe UI,Arial,sans-serif" >Scene y / device d</text><rect x="292" y="120" width="245" height="130" rx="14" fill="#ffffff" stroke="#dce4ec"/><text x="311" y="149" fill="#0d8072" font-size="11" font-weight="700" font-family="Inter,Segoe UI,Arial,sans-serif" letter-spacing="1.0">ENCODER  f</text><text x="311" y="180" fill="#142b46" font-size="20" font-weight="600" font-family="Inter,Segoe UI,Arial,sans-serif" >Representation h</text><text x="311" y="209" fill="#60758b" font-size="13" font-weight="400" font-family="Inter,Segoe UI,Arial,sans-serif" >Scene-discriminative features</text><text x="311" y="231" fill="#60758b" font-size="13" font-weight="400" font-family="Inter,Segoe UI,Arial,sans-serif" >Normal base-loss gradients</text><rect x="596" y="120" width="245" height="130" rx="14" fill="#ffffff" stroke="#dce4ec"/><text x="615" y="149" fill="#0d8072" font-size="11" font-weight="700" font-family="Inter,Segoe UI,Arial,sans-serif" letter-spacing="1.0">PREDICTOR  g</text><text x="615" y="180" fill="#142b46" font-size="20" font-weight="600" font-family="Inter,Segoe UI,Arial,sans-serif" >Scene logits</text><text x="615" y="209" fill="#60758b" font-size="13" font-weight="400" font-family="Inter,Segoe UI,Arial,sans-serif" >Original scene classifier</text><text x="615" y="231" fill="#60758b" font-size="13" font-weight="400" font-family="Inter,Segoe UI,Arial,sans-serif" >Shared trainable parameters</text><rect x="908" y="120" width="330" height="130" rx="14" fill="#fff9f5" stroke="#dce4ec"/><text x="927" y="149" fill="#a25d43" font-size="11" font-weight="700" font-family="Inter,Segoe UI,Arial,sans-serif" letter-spacing="1.0">OBJECTIVE</text><text x="927" y="180" fill="#142b46" font-size="20" font-weight="600" font-family="Inter,Segoe UI,Arial,sans-serif" >Base scene loss</text><text x="927" y="209" fill="#60758b" font-size="13" font-weight="400" font-family="Inter,Segoe UI,Arial,sans-serif" >Cross-entropy on original features</text><text x="927" y="231" fill="#60758b" font-size="13" font-weight="400" font-family="Inter,Segoe UI,Arial,sans-serif" >Updates encoder and predictor</text><path d="M245 185H292" fill="none" stroke="#698399" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M537 185H596" fill="none" stroke="#698399" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M841 185H908" fill="none" stroke="#698399" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M415 250V319" fill="none" stroke="#698399" stroke-width="1.8" marker-end="url(#arrow)" stroke-dasharray="5 5"/><text x="432" y="292" fill="#95684b" font-size="12" font-weight="600" font-family="Inter,Segoe UI,Arial,sans-serif" >detach h</text><rect x="40" y="338" width="250" height="162" rx="14" fill="#ffffff" stroke="#dce4ec"/><text x="59" y="367" fill="#0d8072" font-size="11" font-weight="700" font-family="Inter,Segoe UI,Arial,sans-serif" letter-spacing="1.0">01  /  ANCHORS</text><text x="59" y="398" fill="#142b46" font-size="20" font-weight="600" font-family="Inter,Segoe UI,Arial,sans-serif" >Scene x device cells</text><text x="59" y="427" fill="#60758b" font-size="13" font-weight="400" font-family="Inter,Segoe UI,Arial,sans-serif" >EMA mean + raw second moment</text><text x="59" y="449" fill="#60758b" font-size="13" font-weight="400" font-family="Inter,Segoe UI,Arial,sans-serif" >Same-scene device pairing</text><text x="59" y="471" fill="#60758b" font-size="13" font-weight="400" font-family="Inter,Segoe UI,Arial,sans-serif" >Previously committed statistics</text><rect x="338" y="338" width="250" height="162" rx="14" fill="#ffffff" stroke="#dce4ec"/><text x="357" y="367" fill="#0d8072" font-size="11" font-weight="700" font-family="Inter,Segoe UI,Arial,sans-serif" letter-spacing="1.0">02  /  GEOMETRY</text><text x="357" y="398" fill="#142b46" font-size="20" font-weight="600" font-family="Inter,Segoe UI,Arial,sans-serif" >Closed-form paths</text><text x="357" y="427" fill="#60758b" font-size="13" font-weight="400" font-family="Inter,Segoe UI,Arial,sans-serif" >Fix standardized residual r</text><text x="357" y="449" fill="#60758b" font-size="13" font-weight="400" font-family="Inter,Segoe UI,Arial,sans-serif" >Interpolate mean and scale</text><text x="357" y="471" fill="#60758b" font-size="13" font-weight="400" font-family="Inter,Segoe UI,Arial,sans-serif" >Sample t and t + delta</text><rect x="636" y="338" width="250" height="162" rx="14" fill="#ffffff" stroke="#dce4ec"/><text x="655" y="367" fill="#0d8072" font-size="11" font-weight="700" font-family="Inter,Segoe UI,Arial,sans-serif" letter-spacing="1.0">03  /  SHARED HEAD</text><text x="655" y="398" fill="#142b46" font-size="20" font-weight="600" font-family="Inter,Segoe UI,Arial,sans-serif" >Deterministic g</text><text x="655" y="427" fill="#60758b" font-size="13" font-weight="400" font-family="Inter,Segoe UI,Arial,sans-serif" >Dropout / stochastic masks off</text><text x="655" y="449" fill="#60758b" font-size="13" font-weight="400" font-family="Inter,Segoe UI,Arial,sans-serif" >BatchNorm statistics fixed</text><text x="655" y="471" fill="#60758b" font-size="13" font-weight="400" font-family="Inter,Segoe UI,Arial,sans-serif" >Predictor gradients enabled</text><rect x="934" y="338" width="304" height="162" rx="14" fill="#fff9f5" stroke="#dce4ec"/><text x="953" y="367" fill="#a25d43" font-size="11" font-weight="700" font-family="Inter,Segoe UI,Arial,sans-serif" letter-spacing="1.0">04  /  REGULARIZATION</text><text x="953" y="398" fill="#142b46" font-size="20" font-weight="600" font-family="Inter,Segoe UI,Arial,sans-serif" >Path-loss energy</text><text x="953" y="427" fill="#60758b" font-size="13" font-weight="400" font-family="Inter,Segoe UI,Arial,sans-serif" >Squared finite-difference slope</text><text x="953" y="449" fill="#60758b" font-size="13" font-weight="400" font-family="Inter,Segoe UI,Arial,sans-serif" >First-order backpropagation</text><text x="953" y="471" fill="#60758b" font-size="13" font-weight="400" font-family="Inter,Segoe UI,Arial,sans-serif" >L = L_base + lambda * E_AF</text><path d="M415 319H165V338" fill="none" stroke="#698399" stroke-width="1.8" marker-end="url(#arrow)" stroke-dasharray="5 5"/><path d="M415 319H463V338" fill="none" stroke="#698399" stroke-width="1.8" marker-end="url(#arrow)" stroke-dasharray="5 5"/><path d="M290 419H338" fill="none" stroke="#698399" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M588 419H636" fill="none" stroke="#698399" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M886 419H934" fill="none" stroke="#698399" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M761 338V271H719V250" fill="none" stroke="#698399" stroke-width="1.8" marker-end="url(#arrow)" stroke-dasharray="5 5"/><rect x="40" y="532" width="1198" height="83" rx="13" fill="#e5f4ef" stroke="#cce4dc"/><text x="61" y="563" fill="#0a7966" font-size="11" font-weight="700" font-family="Inter,Segoe UI,Arial,sans-serif" letter-spacing="1.0">COMMIT AFTER A SUCCESSFUL OPTIMIZER STEP</text><text x="61" y="592" fill="#315f55" font-size="15" font-weight="400" font-family="Inter,Segoe UI,Arial,sans-serif" >Accumulate detached moments   →   optimizer step   →   commit anchors   →   next update</text><text x="40" y="640" fill="#536d83" font-size="13" font-weight="400" font-family="Inter,Segoe UI,Arial,sans-serif" >Deployment: audio → encoder → scene predictor. Device labels, anchors and auxiliary paths stay in training.</text></svg>