[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "anchorflow-asc"
version = "0.1.0"
description = "Scene-conditioned device flows for cross-device acoustic scene classification"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = ["torch>=2.2", "numpy>=1.26", "PyYAML>=6.0"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Multimedia :: Sound/Audio :: Analysis",
]

[project.optional-dependencies]
audio = ["torchaudio>=2.2"]
dev = ["ruff>=0.9"]

[project.scripts]
anchorflow = "anchorflow.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
